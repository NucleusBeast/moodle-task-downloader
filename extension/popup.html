<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save assignment content</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <p class="eyebrow">MOODLE · LOCAL EXPORT</p>
    <h1>Keep the assignment.</h1>
    <p>Save the grey area with its deadline, text, links and pictures in one HTML file.</p>
    <button id="save" type="button" disabled>Save grey area</button>
    <button id="copy" class="secondary" type="button" disabled>Copy for agents</button>
    <p id="status" role="status" aria-live="polite">Finding the assignment area…</p>
    <ul id="warnings" hidden></ul>
    <p class="footnote">Opening this popup briefly highlights the area to save. Content stays on your device.</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
